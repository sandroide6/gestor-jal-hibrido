name: Mantener despierto el backend

# Render (plan gratis) duerme el backend tras ~15 min sin tráfico. Este workflow
# llama a /health cada ~10 min para que no se duerma, y de paso mantiene activa
# la base de datos de Supabase (el plan gratis la pausa tras 7 días sin uso).
#
# Notas:
# - GitHub puede retrasar los cron unos minutos en horas de mucha carga; si el
#   backend llega a dormirse igual, el login del frontend espera y reintenta solo.
# - GitHub desactiva los workflows programados tras 60 días sin actividad en el
#   repo. Si pasa, se reactiva desde la pestaña Actions.
# - Para cambiar la URL sin tocar este archivo, crea la variable de repositorio
#   KEEP_ALIVE_URL (Settings → Secrets and variables → Actions → Variables).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a /health
        env:
          URL: ${{ vars.KEEP_ALIVE_URL || 'https://gestor-jal-backend.onrender.com/health' }}
        run: |
          curl --fail --silent --show-error --max-time 90 \
               --retry 3 --retry-delay 10 --retry-all-errors \
               "$URL"
