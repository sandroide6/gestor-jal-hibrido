# Revisión mensual de dependencias (auditoría 2026-11-05, P2-7). Dependabot abre PR que
# pasan por la misma CI; nada se fusiona solo. Las actualizaciones mayores se agrupan
# aparte para revisarlas con calma.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      menores: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      menores: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
